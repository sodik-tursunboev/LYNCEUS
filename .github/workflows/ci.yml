name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the declared floor; local dev runs newer
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The parser libraries only matter to the in-process scanner tests here: the sandbox is Windows-only,
      # so CI never runs it and cannot use the Windows-pinned wheels. Unpinned on purpose; unverified.
      - run: pip install pikepdf pillow opencv-python-headless numpy
      - name: Secret scan (same task as the local pre-commit hook)
        run: git ls-files | grep -Ev '^(docs/schemas|docs/eval|tests/data)/' | xargs python tasks.py secrets
      - name: Lint and type check
        run: python tasks.py lint
      - name: Tests
        run: python tasks.py test
      - name: Eval smoke run (must exit 0 and write a report; no metric gate in M0)
        run: |
          python tasks.py eval --out "$RUNNER_TEMP/eval"
          test -s "$RUNNER_TEMP/eval/dev.json"
