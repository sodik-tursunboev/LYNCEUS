[alembic]
script_location = %(here)s/core/db/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
# The database URL is never stored here: env.py reads MIRAGE_DATABASE_URL (see .env.example).
# No logging config on purpose: env.py does not call fileConfig, so core/log.py stays in charge.
