# Wording for the sentence composer (DA5 phase 3, item 3). Plain language, one sentence per rule id.
# Facts only come from the verdict being explained; this file adds none: no numbers, no brand names,
# no addresses. Keep every [rules] sentence at or under 75 characters (the extension shows at most
# 600 characters of explanation, and the engine appends its own notes after this text).
# {score} and {caveat} are the only placeholders; a test lists every rule id and fails on a gap.

[defaults]
caveat = "This is not evidence of safety."
unknown_rule = "Another check, {rule}, found something unusual."

[what]
MALICIOUS = "Lynceus found strong signs of phishing or malware (risk score {score})."
SUSPICIOUS = "Lynceus found signs of phishing (risk score {score})."
UNKNOWN = "Lynceus could not tell whether this is safe."
UNKNOWN_weak = "Lynceus saw only weak signs, not enough to call it."
BENIGN_official = "This is the official domain of a known brand."
BENIGN = "Lynceus found no sign of risk."
ERROR = "The check could not be completed."
other = "Lynceus has a result it cannot put into words."

# Used only when there is no sign to name (or, for BENIGN, whatever signs there are did not matter).
[why]
UNKNOWN = "No rule found anything to report."
BENIGN_official = "Its address is on Lynceus's list of official domains."
BENIGN = "No rule found anything to report."
ERROR = "The analysis stopped on an internal error."

[how_sure]
LOW = "Confidence is low: little strong evidence, so it may be a false alarm."
MEDIUM = "Confidence is medium: two kinds of evidence agree, but it can be wrong."
HIGH = "Confidence is high: the evidence is strong, but no check is perfect."
UNKNOWN = "No verdict was reached, so there is no confidence level to report."
BENIGN_official = "This only says the domain is official, not that every page on it is safe."
BENIGN = "No risk was found, which is not a guarantee."
ERROR = "No confidence level applies because the check failed."
other = "Lynceus cannot say how sure this is."

# Looked up as STATE.RESPONSE first, then STATE.
[next]
"MALICIOUS.BLOCK" = "Do not open it or enter anything; Lynceus recommends blocking it."
"MALICIOUS.QUARANTINE" = "Do not open it; Lynceus recommends moving it to quarantine."
MALICIOUS = "Do not open it or enter anything on it."
SUSPICIOUS = "Do not sign in or download from it unless you are sure of its source."
UNKNOWN = "{caveat} Take care until you know the source."
BENIGN = "No action is needed."
ERROR = "Treat it as unchecked and try again later."
other = "Check the verdict details before acting."

