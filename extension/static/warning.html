<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynceus warning</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<main>
  <h1 id="title">Lynceus</h1>
  <p id="lead"></p>
  <p class="muted">The address:</p>
  <p class="url" id="url"></p>
  <p id="why"></p>
  <ul id="reasons"></ul>
  <div class="actions" id="actions">
    <button class="primary" id="back" type="button">Go back</button>
    <button id="continue" type="button">Continue anyway (15 minutes, recorded)</button>
      <button id="report" type="button">This warning is wrong: report it and continue</button>
  </div>
  <p class="muted" id="status" role="status"></p>
</main>
<script type="module" src="warning.js"></script>
</body>
</html>
