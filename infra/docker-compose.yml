# Local PostgreSQL for development. Credentials come from .env (see .env.example), never from here.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:15432:5432" # loopback only: never expose the database to the network. Not 5432: other software (Splunk ships its own PostgreSQL) takes that port on this machine. Below 49152: Windows reserves random blocks of the dynamic range for Hyper-V/WSL (55432 was refused on 2026-11-16)
    volumes:
      - mirage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mirage_pgdata:
