[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "core/sandbox/guest"]   # the guest modules import each other by bare name
markers = ["integration: needs a reachable PostgreSQL (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S311", "S603", "S607"]   # assert is pytest; fake secrets and seeded fuzz are test data
"tasks.py" = ["S603", "S607"]   # fixed argv lists, no shell; git/docker come from PATH

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ada_url", "ada_url.*"]
ignore_missing_imports = true  # ada-url ships no type information

[[tool.mypy.overrides]]
module = [
  "limits", "htmlscan", "mailparse", "textscan", "worker", "filetype", "filescan", "archives",
  "pdfscan", "imagescan",
]
ignore_missing_imports = true  # sandbox guest modules run with their own folder as the path

[[tool.mypy.overrides]]
module = ["contentscan", "lnkscan", "pescan", "olescan", "vbaeval", "vbaanalyze", "xlmscan"]
ignore_missing_imports = true  # more sandbox guest modules (deep content analysis)

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "pikepdf", "pikepdf.*", "lxml", "lxml.*", "numpy", "numpy.*", "PIL", "PIL.*"]
ignore_missing_imports = true  # sandbox-only libraries; the host never imports them
ignore_errors = false
