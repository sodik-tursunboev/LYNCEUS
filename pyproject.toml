[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a reachable PostgreSQL (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert is how pytest works; fake secrets are test data
"tasks.py" = ["S603", "S607"]   # fixed argv lists, no shell; git/docker come from PATH

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
