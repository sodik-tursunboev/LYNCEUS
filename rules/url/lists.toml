# Word and host lists for the URL rules. Provenance: drafted by hand 2026-11-04 from general
# knowledge, unverified. These are data, not code: changing them changes the ruleset hash.

# Words that turn "brand in a domain" into a combosquat, and brand mentions into credential bait.
keywords = [
  "login", "log-in", "signin", "sign-in", "secure", "security", "verify", "verification", "account",
  "update", "support", "billing", "confirm", "invoice", "recovery", "alert", "auth", "wallet",
  "payment", "suspended", "unlock", "helpdesk", "webmail",
  # Polish, without diacritics (hostnames rarely carry them)
  "logowanie", "zaloguj", "weryfikacja", "potwierdzenie", "potwierdz", "konto", "platnosc",
  "platnosci", "odbior", "paczka", "paczki", "przesylka", "doplata", "dostawa", "bezpieczenstwo",
  "aktualizacja", "blokada", "faktura", "odblokuj", "zwrot",
]

# A whole path segment made only of these looks like a login or verification page.
login_words = [
  "login", "signin", "logon", "verify", "auth", "reauth", "account", "update", "billing", "confirm",
  "identity", "webscr", "webmail", "secure", "password", "logowanie", "zaloguj", "weryfikacja",
]

# Query parameters that open-redirect kits and legitimate apps both use. Off-site targets only.
redirect_params = [
  "url", "uri", "redirect", "redirect_uri", "redirect_url", "redirecturl", "redir", "next",
  "continue", "dest", "destination", "goto", "go", "return", "return_to", "returnurl", "r", "u",
  "target", "to", "link", "out", "q",
]

# DA5: sign-in services' own hosts (a host or any subdomain of it). Their `redirect_uri` names the app
# that asked for the sign-in, in every legitimate flow, so it weighs little there (url.idp_redirect).
# Costs 0 of 88,938 training phishing addresses; consent phishing keeps its other signals.
identity_provider_hosts = [
  "login.microsoftonline.com", "login.live.com", "login.windows.net", "b2clogin.com",
  "accounts.google.com", "auth0.com", "okta.com", "oktapreview.com", "okta-emea.com",
  "onelogin.com", "login.salesforce.com", "appleid.apple.com",
  "idp.test",  # a reserved name, so the rule's fixtures can stay on reserved hosts
]

# DA3: parameters that say where the visitor CAME FROM, not where they are sent (a chat widget carries the
# embedding page's address, base64-encoded, in `referrer`): a hidden address there is not an
# encoded target. Costs 0 of 88,938 training phishing addresses; removed 5 false alarms on dev.
referrer_params = ["referrer", "referer", "ref", "origin"]

# Share dialogs on official domains (E1): their url parameter is the page being shared, shown in a
# dialog; the visitor is not sent there. "path?param" also needs that query parameter.
share_paths = [
  "/sharer/sharer.php", "/sharer.php", "/sharing/share-offsite", "/sharearticle", "/share",
  "/share/url", "/intent/tweet", "/intent/post", "/pin/create/button", "/feed?shareactive",
]

# Query parameters that prefill a victim's identity on a fake login page.
identity_params = ["email", "e-mail", "mail", "user", "username", "userid", "login", "login_hint"]

ordinary_ports = [80, 443, 8000, 8080, 8443]

# The last four are the reserved names used by the test corpus.
shorteners = [
  "bit.ly", "tinyurl.com", "t.co", "goo.gl", "ow.ly", "is.gd", "buff.ly", "cutt.ly", "rebrand.ly",
  "rb.gy", "shorturl.at", "tiny.cc", "t.ly", "s.id", "v.gd", "shorte.st", "bl.ink", "lnkd.in",
  "shorty.test", "tinylink.test", "shrtn.test", "minilink.test",
]

# Ordinary words one edit away from a brand term: never a typosquat.
not_typos = ["apply", "ample", "maple", "stream", "paypay", "adore", "abode", "goggles", "giggle"]

# Official hosts where anyone can publish content: never allowlisted, whoever owns the domain.
shared_hosts = [
  "sites.google.com", "docs.google.com", "drive.google.com", "forms.office.com", "sharepoint.com",
  "onedrive.live.com", "1drv.ms", "storage.googleapis.com",
  # added after the independent review: official hosts that serve whatever a user uploads or scripts
  "script.google.com", "forms.gle", "firebasestorage.googleapis.com", "dropbox.com", "github.com",
  "githubusercontent.com", "sway.office.com", "notion.so", "blob.core.windows.net", "amazonaws.com",
]
